# SiteGateAuth: вход на сервер через сайт.
# Игрок проходит капчу, жмёт «Нажмите, чтобы авторизоваться», регистрируется или входит на сайте
# и подтверждает вход. Пароль в игре не вводится.

[site]
# Адрес сайта, без слэша в конце
url = "https://example.com"
# Токен API, тот же, что у сайта. Пустой = на сервер не пускают никого.
token = ""
# Или файл с токеном, например docker secret "/run/secrets/auth_api_token".
# Относительный путь считается от папки plugins/sitegateauth. Задавайте что-то одно: token или token-file.
token-file = ""
# Таймаут одного запроса к сайту, в секундах
timeout-seconds = 5

[auth]
# Как часто спрашивать сайт, подтвердил ли игрок вход, в секундах
poll-seconds = 3
# Сколько ждать подтверждения на сайте, в минутах. Потом кик.
wait-minutes = 10
# Сколько дней хранится локальная копия сессий. Она нужна, только если сайт недоступен:
# тогда игроки с живой сессией всё равно заходят.
cache-days = 7
# Сколько входов в минуту разрешено с одного IP
logins-per-minute = 5

[captcha]
# Сколько вариантов ответа показывать
buttons = 6
# Сколько ошибок можно сделать
attempts = 3
# На сколько минут закрыть вход с IP после проваленной капчи
ban-minutes = 5

# Тексты в формате MiniMessage: https://docs.advntr.dev/minimessage/format.html
[messages]
title = "<gradient:#9b8cff:#6ad5ff><b>MyServer</b></gradient>"
captcha-prompt = "Проверка, что ты не бот.\n\nСколько будет <white><bold><x> + <y></bold></white>?"
captcha-wrong = "<red>Неверно.</red> Осталось попыток: <white><left></white>\n\nСколько будет <white><bold><x> + <y></bold></white>?"
login-body = "Вход на сервер идёт через сайт.\n\nНажмите кнопку ниже: откроется сайт. Войдите или зарегистрируйтесь и подтвердите вход."
login-hint = "<gray>Ссылка действует <minutes> мин. После подтверждения вы сразу попадёте на сервер.</gray>"
login-button = "<green><b>Нажмите, чтобы авторизоваться</b></green>"
leave-button = "Выйти"

kick-closed = "<red>Вход временно закрыт.</red>\n\nПопробуйте позже."
kick-bad-name = "<red>Недопустимый ник.</red>\n\nНик: от 3 до 16 символов, только латиница, цифры и _"
kick-old-client = "<red>Нужен клиент Minecraft 26.3.</red>"
kick-rate-limit = "<red>Слишком много попыток входа.</red>\n\nПодождите минуту."
kick-captcha-ban = "<red>Капча не пройдена.</red>\n\nПопробуйте через <minutes> мин."
kick-timeout = "<red>Время на вход истекло.</red>\n\nЗайдите снова, чтобы получить новую ссылку."
kick-denied = "<red>Вход отклонён на сайте.</red>\n\nЕсли это были не вы, смените пароль в личном кабинете."
kick-site-down = "<red>Сайт авторизации недоступен.</red>\n\nПопробуйте через пару минут."
kick-left = "Вы вышли."
