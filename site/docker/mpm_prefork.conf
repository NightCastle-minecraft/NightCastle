# Мало процессов: каждый держит постоянное соединение с базами на хостинге,
# а там лимит соединений на пользователя. 12 воркеров хватает с запасом.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       12
    MaxConnectionsPerChild 1000
</IfModule>
