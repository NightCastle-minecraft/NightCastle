ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # API SiteGateAuth: Bearer-токен должен дойти до PHP
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [L]
    </Directory>

    # В uploads PHP не исполняется
    <Directory /var/www/html/public/uploads>
        php_admin_flag engine off
        RemoveHandler .php .phtml .php3 .php5 .phar
        Options -Indexes -ExecCGI

        <FilesMatch "\.(php|phtml|phar|php\d|pht|shtml|cgi|pl|py)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Служебные файлы наружу не отдаём
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Версии наружу не отдаём (PHP тоже: expose_php=Off)
    Header always unset X-Powered-By

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
